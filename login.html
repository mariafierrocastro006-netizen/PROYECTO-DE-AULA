<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaFit Store - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">


</head>
<body>

    <div class="login-wrapper">

        <main class="login-card">  
            <header class="login-header">
                <div class="logo-box">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <h1 class="brand-title">VidaFit Store</h1>
                <p class="brand-subtitle">Tu tienda de ropa deportiva femenina favorita</p>
            </header>

            
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div id="message" style="margin-bottom: 15px; font-weight: 500; text-align: center; font-size: 0.9rem;"></div>
                <button type="submit" class="submit-btn">Iniciar Sesión</button>
            </form>

            <form class="login-form" id="registerForm" style="display: none;">
                <div class="input-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="tu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <div id="reg-message" style="margin-bottom: 15px; font-weight: 500; text-align: center; font-size: 0.9rem;"></div>
                <button type="submit" class="submit-btn">Registrarse</button>
            </form>

            <footer class="login-footer">
                <p id="toggle-text">¿No tienes cuenta? <a href="#" id="toggle-form-btn">Regístrate aquí</a></p>
            </footer>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
