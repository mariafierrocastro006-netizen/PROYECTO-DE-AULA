<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaFit Store - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">

</head>
<body>

    <div class="login-wrapper">

        <main class="login-card">  
            <header class="login-header">
                <div class="logo-box">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <h1 class="brand-title">VidaFit Store</h1>
                <p class="brand-subtitle">Tu tienda de ropa deportiva femenina favorita</p>
            </header>

            
            <form class="login-form">

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="input-group role-group">
                    <label>Tipo de Usuario</label>
                    <div class="role-selectors">
                          
                        <div class="role-option">
                            <input type="radio" id="role-user" name="user_role" checked>
                            <label for="role-user" class="role-btn user-btn">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>Usuario</span>
                            </label>
                        </div>

                        <div class="role-option">
                            <input type="radio" id="role-admin" name="user_role">
                            <label for="role-admin" class="role-btn admin-btn">
                                <i class="fa-solid fa-gears"></i>
                                <span>Admin</span>
                            </label>
                        </div>

                    </div>
                </div>

               
                <button type="submit" class="submit-btn">Iniciar Sesión</button>

            </form>

        
            <footer class="login-footer">
                <p>¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
            </footer>

        </main>

    </div>

</body>
</html>
